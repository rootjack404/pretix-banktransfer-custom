[project]
name = "pretix-banktransfer-custom"
dynamic = ["version"]
description = "Custom pretix bank transfer payment plugin with randomized amount suffix matching"
readme = "README.rst"
requires-python = ">=3.9"
license = {text = "AGPL-3.0-or-later"}
keywords = ["pretix"]
authors = [
    {name = "rootjack404"},
]
maintainers = [
    {name = "rootjack404"},
]

dependencies = []

[project.entry-points."pretix.plugin"]
pretix_banktransfer_custom = "pretix_banktransfer_custom:PretixPluginMeta"

[project.entry-points."distutils.commands"]
build = "pretix_plugin_build.build:CustomBuild"

[build-system]
requires = [
    "setuptools",
    "pretix-plugin-build",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "pretix_banktransfer_custom.__version__"}

[tool.setuptools.packages.find]
include = ["pretix*"]
namespaces = false
